<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Northlight Helpdesk</title>
  <link rel="stylesheet" href="helpdesk.css">
</head>
<body>
  <main>
    <p><a href="index.html">&larr; Northlight Studio</a></p>
    <h1>Helpdesk</h1>

    <form id="ticket-form">
      <h2>New ticket</h2>
      <label>Requester <input name="requester" required maxlength="60"></label>
      <label>Issue <textarea name="issue" required maxlength="300" rows="3"></textarea></label>
      <label>Impact
        <select name="impact">
          <option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option>
        </select>
      </label>
      <label>Urgency
        <select name="urgency">
          <option value="1">Low</option><option value="2" selected>Medium</option><option value="3">High</option>
        </select>
      </label>
      <button type="submit">Create ticket</button>
    </form>

    <h2>Tickets</h2>
    <button type="button" id="export">Export tickets (JSON)</button>
    <p>Response targets: P1 1 hour, P2 4 hours, P3 24 hours.</p>
    <ul id="tickets"></ul>
  </main>
  <script src="helpdesk.js"></script>
</body>
</html>
